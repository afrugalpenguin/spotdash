name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      # No cgo in the shipped binary, so this cross-compiles from Linux.
      # -H=windowsgui is what stops it opening a console window at login.
      - name: Build spotdash.exe
        working-directory: agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=${GITHUB_REF_NAME}" -o spotdash.exe ./cmd/spotdash

      - name: Stage release files
        run: |
          mkdir -p dist/tools
          cp agent/spotdash.exe dist/
          cp agent/config.example.json dist/
          cp agent/tools/autostart.ps1 dist/tools/
          cp tools/provision.ps1 dist/tools/
          cp LICENSE dist/

      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: dist

  apk:
    runs-on: ubuntu-latest
    steps:
      # Never falls back to a debug key: an unsigned run stops here.
      - name: Check signing secrets
        env:
          SPOTDASH_KEYSTORE_B64: ${{ secrets.SPOTDASH_KEYSTORE_B64 }}
          SPOTDASH_KEYSTORE_PASSWORD: ${{ secrets.SPOTDASH_KEYSTORE_PASSWORD }}
          SPOTDASH_KEY_ALIAS: ${{ secrets.SPOTDASH_KEY_ALIAS }}
          SPOTDASH_KEY_PASSWORD: ${{ secrets.SPOTDASH_KEY_PASSWORD }}
        run: |
          missing=()
          for name in SPOTDASH_KEYSTORE_B64 SPOTDASH_KEYSTORE_PASSWORD SPOTDASH_KEY_ALIAS SPOTDASH_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: |
          .github/scripts/apk-version.sh --self-test
          .github/scripts/apk-version.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore
        env:
          SPOTDASH_KEYSTORE_B64: ${{ secrets.SPOTDASH_KEYSTORE_B64 }}
        run: printf '%s' "$SPOTDASH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/spotdash.keystore"

      - name: Build signed APK
        working-directory: shell
        env:
          SPOTDASH_KEYSTORE_PATH: ${{ runner.temp }}/spotdash.keystore
          SPOTDASH_KEYSTORE_PASSWORD: ${{ secrets.SPOTDASH_KEYSTORE_PASSWORD }}
          SPOTDASH_KEY_ALIAS: ${{ secrets.SPOTDASH_KEY_ALIAS }}
          SPOTDASH_KEY_PASSWORD: ${{ secrets.SPOTDASH_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PversionName=${{ steps.version.outputs.versionName }}
          -PversionCode=${{ steps.version.outputs.versionCode }}

      - name: Verify signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs shell/app/build/outputs/apk/release/app-release.apk
          cp shell/app/build/outputs/apk/release/app-release.apk "spotdash-shell-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: spotdash-shell-${{ github.ref_name }}.apk

  # Only runs when both builds pass, so a failed APK leaves no release behind.
  publish:
    needs: [agent, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist/shell

      - name: Package release zip
        run: cd dist && zip -r ../spotdash-${GITHUB_REF_NAME}-windows-amd64.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            spotdash-${{ github.ref_name }}-windows-amd64.zip
            dist/shell/spotdash-shell-${{ github.ref_name }}.apk
          generate_release_notes: true
          # A tag such as v0.2.0-rc1 is a pre-release, not the latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
